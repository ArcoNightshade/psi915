#
# driver.conf(5) for the psi915 i915 driver (Linux 6.14 i915 on the
# LinuxKPI). Installed as /usr/kernel/drv/i915.conf. UNTESTED ON ILLUMOS.
#
# Properties named like Linux i915 module parameters are applied before
# probe (lkpi_module_params_apply; the list is psi915_i915_params() in
# drivers/i915_glue/i915_drm_glue.c). Integers are int properties, strings
# string properties; booleans accept 0/1 or "Y"/"N". Only the parameters
# below that are uncommented take effect; the Linux defaults apply otherwise.
#
# Non-property tunables (/etc/system, read in _init or attach):
#   set i915:psi915_nomodeset = 1          no KMS (Linux nomodeset): the
#                                          device attaches console-only
#   set i915:psi915_console_fallback = 0   fail attach instead of keeping
#                                          the firmware console on probe
#                                          failure
#   set i915:psi915_enable_console = 0     no console minor (headless; the
#                                          boot console then has no device)
#   set linuxkpi_gpl_g1:drmglue_ioctl_abi = 1
#                                          accept Linux ioctl encodings
#                                          (docs/10 section 2.4; default 0 =
#                                          illumos <sys/ioccom.h>); drmglue
#                                          is linked into linuxkpi_gpl_g1
#   set linuxkpi:linuxkpi_bug_panic = 1    Linux BUG() panics
#
# Bring-up defaults for Kaby Lake-R (pci8086,5917):
#   GuC/HuC off (Linux default for Gen9: enable_guc=0 means execlists
#   submission and no HuC); DMC firmware from /usr/lib/firmware/i915.

# Linux i915 parameters (uncomment to override):
#modeset=1;
#enable_guc=0;
#enable_dc=-1;
#enable_fbc=-1;
#enable_psr=-1;
#enable_dp_mst=1;
#disable_power_well=-1;
#invert_brightness=0;
#verbose_state_checks=1;
#mmio_debug=0;
#dmc_firmware_path="i915/kbl_dmc_ver1_04.bin";
#guc_firmware_path="i915/kbl_guc_70.1.1.bin";
#huc_firmware_path="i915/kbl_huc_4.0.0.bin";

# Not suspend-safe until P7 (docs/04): keep the device attached.
ddi-no-autodetach=1;
