#
# meson cross file: Linux x86_64 build host -> illumos amd64 target. UNTESTED.
#
# Requirements (not provided by this repository):
#  - a cross gcc for x86_64-pc-solaris2.11 (e.g. built with crosstool-style
#    scripts against an illumos sysroot; binutils must emit Solaris ELF and
#    the link must go through an illumos-compatible ld, e.g. GNU ld configured
#    for x86_64-pc-solaris2.11);
#  - a sysroot: the /usr and /lib trees of the target (OI or Tribblix,
#    exported from a running system or a pkg image-create), with the
#    -dev headers for every dependency (libpciaccess, X11 libs, expat, zlib,
#    zstd, LLVM). Set the constant below and PSI_SYSROOT to the same path.
#  - llvm-config: Mesa cross builds need a TARGET llvm-config. Point it at a
#    wrapper that prints the sysroot's LLVM flags, or build with
#    PSI_MESA_LLVM=0 (softpipe instead of llvmpipe).
#  - Mesa also runs host tools at build time (python, glslangValidator for
#    anv, and in newer Mesa mesa_clc/intel_clc). Install them on the build host.
#
# The native build on the target is the primary path; this file exists for
# CI-style builds and is the least verified piece of the userland track.

[constants]
sysroot = '/opt/illumos-sysroot'
triple = 'x86_64-pc-solaris2.11'

[binaries]
c = triple + '-gcc'
cpp = triple + '-g++'
ar = triple + '-ar'
strip = triple + '-strip'
pkg-config = 'pkg-config'
llvm-config = sysroot + '/../llvm-config-wrapper'

[built-in options]
c_args = ['--sysroot=' + sysroot, '-D__EXTENSIONS__', '-D_POSIX_PTHREAD_SEMANTICS']
cpp_args = ['--sysroot=' + sysroot, '-D__EXTENSIONS__', '-D_POSIX_PTHREAD_SEMANTICS']
c_link_args = ['--sysroot=' + sysroot, '-Wl,-R/opt/psi915/lib', '-L' + sysroot + '/usr/lib/amd64', '-L' + sysroot + '/lib/amd64']
cpp_link_args = ['--sysroot=' + sysroot, '-Wl,-R/opt/psi915/lib', '-L' + sysroot + '/usr/lib/amd64', '-L' + sysroot + '/lib/amd64']

[properties]
sys_root = sysroot
pkg_config_libdir = [sysroot + '/opt/psi915/lib/pkgconfig', sysroot + '/usr/lib/amd64/pkgconfig', sysroot + '/usr/share/pkgconfig']
needs_exe_wrapper = true

[host_machine]
# meson reports illumos and Solaris as "sunos".
system = 'sunos'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
