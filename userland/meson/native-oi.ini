#
# meson native file: OpenIndiana 2026.10, 64-bit, building the psi915 stack
# into /opt/psi915 (paths assume the default --prefix). UNTESTED.
#
# Paths are believed correct from oi-userland make-rules (gcc 14 in
# /usr/gcc/14, LLVM/clang 21 in /usr/clang/21); not checked on a live system.

[binaries]
c = '/usr/gcc/14/bin/gcc'
cpp = '/usr/gcc/14/bin/g++'
ar = '/usr/gcc/14/bin/gcc-ar'
strip = '/usr/bin/gstrip'
pkg-config = '/usr/bin/pkg-config'
llvm-config = '/usr/clang/21/bin/llvm-config'
python = '/usr/bin/python3'

[built-in options]
# __EXTENSIONS__: expose POSIX + illumos extensions alongside C99/C11.
# _POSIX_PTHREAD_SEMANTICS: POSIX getpwnam_r & co. (oi-userland Mesa uses it).
# -I...psi915-compat: <linux/types.h>, <linux/ioctl.h> for the kernel uAPI
# copies in Mesa (include/drm-uapi) and igt; build.sh installs them there
# before the first component (from userland/compat/include).
c_args = ['-D__EXTENSIONS__', '-D_POSIX_PTHREAD_SEMANTICS', '-I/opt/psi915/include/psi915-compat']
cpp_args = ['-D__EXTENSIONS__', '-D_POSIX_PTHREAD_SEMANTICS', '-I/opt/psi915/include/psi915-compat']
# RUNPATH so the private stack wins over /usr/lib/amd64 (system libdrm/Mesa),
# plus the gcc runtime and LLVM. -z ignore drops unused DT_NEEDED entries.
c_link_args = ['-Wl,-R/opt/psi915/lib', '-Wl,-R/usr/gcc/14/lib/amd64', '-Wl,-R/usr/clang/21/lib', '-Wl,-zignore']
cpp_link_args = ['-Wl,-R/opt/psi915/lib', '-Wl,-R/usr/gcc/14/lib/amd64', '-Wl,-R/usr/clang/21/lib', '-Wl,-zignore']
pkg_config_path = ['/opt/psi915/lib/pkgconfig', '/opt/psi915/share/pkgconfig', '/usr/lib/amd64/pkgconfig', '/usr/share/pkgconfig']
