#
# meson native file: Tribblix 0m41.1, 64-bit, building the psi915 stack into
# /opt/psi915. UNTESTED.
#
# Believed from tribblix/build recipes: gcc from the develop overlay on PATH
# as gcc/g++ (location not checked), LLVM (TRIBllvm) in /usr/versions/llvm.

[binaries]
c = 'gcc'
cpp = 'g++'
ar = 'gcc-ar'
strip = 'gstrip'
pkg-config = 'pkg-config'
llvm-config = '/usr/versions/llvm/bin/llvm-config'
python = 'python3'

[built-in options]
# -I...psi915-compat: <linux/types.h>, <linux/ioctl.h> for the kernel uAPI
# copies in Mesa (include/drm-uapi) and igt; build.sh installs them there
# before the first component (from userland/compat/include).
c_args = ['-D__EXTENSIONS__', '-D_POSIX_PTHREAD_SEMANTICS', '-I/opt/psi915/include/psi915-compat']
cpp_args = ['-D__EXTENSIONS__', '-D_POSIX_PTHREAD_SEMANTICS', '-I/opt/psi915/include/psi915-compat']
c_link_args = ['-Wl,-R/opt/psi915/lib', '-Wl,-R/usr/versions/llvm/lib', '-Wl,-zignore']
cpp_link_args = ['-Wl,-R/opt/psi915/lib', '-Wl,-R/usr/versions/llvm/lib', '-Wl,-zignore']
pkg_config_path = ['/opt/psi915/lib/pkgconfig', '/opt/psi915/share/pkgconfig', '/usr/lib/amd64/pkgconfig', '/usr/share/pkgconfig']
