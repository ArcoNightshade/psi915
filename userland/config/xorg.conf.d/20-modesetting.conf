# Xorg configuration for the psi915 stack: modesetting + glamor + DRI3.
# Use with the private server: /opt/psi915/bin/Xorg :1 -config <this file>
# UNTESTED. BusID is the Kaby Lake-R iGPU's usual address; check with
# `prtconf -d` / `scanpci` on the target.

Section "ServerFlags"
	Option "AutoAddDevices" "false"		# no udev/hal hotplug on illumos
EndSection

Section "Module"
	Load "glamoregl"
	Load "glx"
EndSection

Section "Device"
	Identifier "psi915-igpu"
	Driver "modesetting"
	BusID "PCI:0:2:0"
	Option "kmsdev" "/dev/dri/card0"
	Option "AccelMethod" "glamor"
	Option "DRI" "3"
	# Fallback when glamor/EGL fails during bring-up:
	# Option "AccelMethod" "none"
EndSection

Section "Screen"
	Identifier "psi915-screen"
	Device "psi915-igpu"
EndSection
