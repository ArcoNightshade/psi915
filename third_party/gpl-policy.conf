# GPL module policy enforced by scripts/import-linux.sh -c (docs/08 section 5).
# Format: <key><TAB-or-space><path>.  Paths are relative to the tree root (gpl/, drm/, ...).
#
# allow-c: the only GPL-only .c files that may be compiled (gpl/, sets core/link).
#   G1 = dma-buf group: depends on the KPI only; used by drm and i915.
#   G2 = DRM helpers: depend on drm; used by i915 only, never by drm/.
g1	drivers/dma-buf/dma-buf.c
g1	drivers/dma-buf/dma-fence.c
g1	drivers/dma-buf/dma-fence-array.c
g1	drivers/dma-buf/dma-fence-chain.c
g1	drivers/dma-buf/dma-fence-unwrap.c
g1	drivers/dma-buf/sync_file.c
g2	drivers/gpu/drm/display/drm_hdcp_helper.c
g2	drivers/gpu/drm/drm_gem_framebuffer_helper.c
#
# allow-header: GPL headers in gpl/ that MIT/BSD code (drm/, i915/, drm_bsd/) may still include.
# Each entry is a known debt; remove it once the header is replaced in drm_bsd/ or its include is patched
# out.  A path under include/ is matched as <name> in #include <name>; other paths by basename.
# Not listed on purpose: include/drm/drm_format_helper.h (GPL-2.0-or-later).  It was reached only
# through the upstream drm_gem_atomic_helper.h, which drm_bsd/ now replaces (docs/04 R-G1).
allow-header	drivers/gpu/drm/display/drm_dp_mst_topology_internal.h
allow-header	include/drm/drm_accel.h
allow-header	include/drm/drm_mipi_dsi.h
allow-header	include/drm/drm_of.h
allow-header	include/drm/intel/i915_hdcp_interface.h
allow-header	include/drm/intel/intel-gtt.h
