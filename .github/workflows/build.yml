# SPDX-License-Identifier: BSD-2-Clause
name: build

on:
  push:
    branches: ['psl/**', 'main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux (unit tests, stub syntax check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc clang make python3
      - name: Unit tests and kmod stub check
        run: make check
      - name: Object lists up to date
        run: sh scripts/gen-module-objs.sh -c
      - name: Syntax check of the module set (stub headers)
        run: sh scripts/build-gfx.sh syntax-check HOST_STUBS=1 -j"$(nproc)"
      - name: Link check
        run: sh scripts/kpi-linkcheck.sh
      - name: Module load-order check
        run: python3 scripts/kpi-modcheck.py

  illumos:
    name: ${{ matrix.os }} kernel modules
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [omnios, openindiana]
    steps:
      - uses: actions/checkout@v7
      - name: Build in OmniOS
        if: matrix.os == 'omnios'
        uses: vmactions/omnios-vm@v1.3.8
        with:
          mem: 6144
          cache-after-prepare: true
          prepare: |
            pkg install build-essential || pkg install developer/gcc14 developer/build/gnu-make system/header
          run: |
            sh ci/illumos-build.sh
      - name: Build in OpenIndiana
        if: matrix.os == 'openindiana'
        uses: vmactions/openindiana-vm@v1.2.0
        with:
          mem: 6144
          cache-after-prepare: true
          prepare: |
            pkg install build-essential || pkg install developer/gcc-13 developer/build/gnu-make system/header
          run: |
            sh ci/illumos-build.sh
      - name: VM console / qemu logs (panic messages)
        if: always()
        run: |
          set +e
          for d in /home/runner/work/_actions/vmactions/*/*/output /home/runner/work/_actions/_vmcache; do
            [ -d "$d" ] || continue
            echo "== files in $d"; find "$d" -maxdepth 3 -type f \( -iname '*.log' -o -iname '*serial*' -o -iname '*console*' -o -iname '*.txt' \) -size -50M 2>/dev/null | head -20
          done
          for f in $(find /home/runner/work/_actions -type f \( -iname '*serial*' -o -iname '*console*' -o -iname 'qemu*.log' -o -iname '*vm*.log' \) -size -50M 2>/dev/null | head -5); do
            echo "== tail of $f"; tail -n 120 "$f"
          done
      - name: Collect modules
        if: always()
        run: |
          mkdir -p out
          cp -f ci-build.log ci-load-test.log out/ 2>/dev/null || true
          find build drivers -type f \( -path '*/obj64/*' -o -path '*/debug64/*' \) ! -name '*.o' -print0 2>/dev/null \
            | xargs -0 -r cp --parents -t out || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: modules-${{ matrix.os }}
          path: out
          if-no-files-found: warn
